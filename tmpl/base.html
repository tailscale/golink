<!doctype html>
<html lang="en">
<head>
  <title>{{go}}/</title>
  <link rel="stylesheet" href="/.static/base.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="search" type="application/opensearchdescription+xml" title="go" href="/.opensearch" />
  <link rel="icon" href="/.static/favicon.png">
  <link rel="icon" href="/.static/favicon.svg">
</head>
<body class="flex flex-col min-h-screen tabular-nums">
  <div class="bg-gray-100 border-b border-gray-200 pt-4 pb-2 mb-6">
    <header class="container mx-auto px-4 gl-header">
      <div class="gl-header-top">
        <h1 class="text-2xl font-bold pb-1"><a href="/">{{go}}/</a></h1>
        {{/*
          Search combobox. Server-rendered form (GET /.search) works with
          JS disabled; search.js progressively enhances it into a
          WAI-ARIA combobox with a listbox popup.
        */}}
        <form class="gl-search" method="GET" action="/.search" role="search">
          <label for="gl-search-input" class="sr-only">Search links</label>
          <input
            type="search"
            name="q"
            id="gl-search-input"
            class="gl-search-input"
            placeholder="..."
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-expanded="false"
            aria-controls="gl-search-listbox"
            aria-autocomplete="list"
            aria-activedescendant=""
            aria-label="Search links">
          <ul id="gl-search-listbox" class="gl-search-listbox" role="listbox" aria-label="Link suggestions" hidden></ul>
          <div id="gl-search-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
        </form>
      </div>
      <div class="gl-header-tagline">A private shortlink service for your tailnet</div>
    </header>
  </div>

  <main class="container mx-auto px-4 flex-1">
    {{ block "main" .}}{{ end }}
  </main>
  <footer class="bg-gray-100 border-t border-gray-200 pt-2 pb-2 mt-6">
    <div class="container mx-auto px-4 leading-6 text-right">
      From the nerds at
      <a href="https://tailscale.com/" class="inline-block align-text-top">
      <svg width="18" height="18" viewBox="0 0 22 22" fill="none" role="img" aria-labelledby="tsTitle" xmlns="http://www.w3.org/2000/svg">
        <title id="tsTitle">Tailscale</title>
        <circle opacity="0.2" cx="3.4" cy="3.25" r="2.7" fill="currentColor" />
        <circle cx="3.4" cy="11.3" r="2.7" fill="currentColor" />
        <circle opacity="0.2" cx="3.4" cy="19.5" r="2.7" fill="currentColor" />
        <circle cx="11.5" cy="11.3" r="2.7" fill="currentColor" />
        <circle cx="11.5" cy="19.5" r="2.7" fill="currentColor" />
        <circle opacity="0.2" cx="11.5" cy="3.25" r="2.7" fill="currentColor" />
        <circle opacity="0.2" cx="19.5" cy="3.25" r="2.7" fill="currentColor" />
        <circle cx="19.5" cy="11.3" r="2.7" fill="currentColor" />
        <circle opacity="0.2" cx="19.5" cy="19.5" r="2.7" fill="currentColor" />
      </svg>
      </a>
    </div>
  </footer>
  <script src="/.static/search.js" defer></script>
</html>
